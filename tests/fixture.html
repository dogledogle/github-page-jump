<!doctype html>
<html lang="en" data-color-mode="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GitHub Page Jump fixture</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="../src/content.css">
    <style>
      :root {
        --borderColor-default: #d0d7de;
        --borderColor-muted: #afb8c1;
        --borderColor-accent-emphasis: #0969da;
        --borderColor-danger-emphasis: #cf222e;
        --fgColor-default: #1f2328;
        --fgColor-muted: #656d76;
        --fgColor-accent: #0969da;
        --bgColor-default: #ffffff;
        --bgColor-muted: #f6f8fa;
        --bgColor-neutral-muted: rgba(175, 184, 193, 0.2);
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        gap: 32px;
        place-items: center;
        color: #1f2328;
        background: #ffffff;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      [data-hidden-viewport-ranges] {
        display: flex;
        align-items: center;
      }

      [data-component="Pagination.Page"],
      [data-component="Pagination.PreviousPage"],
      [data-component="Pagination.NextPage"] {
        display: inline-flex;
        min-width: 32px;
        height: 32px;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        padding: 0 10px;
        border-radius: 6px;
        color: #0969da;
        text-decoration: none;
      }

      [aria-current="page"] {
        color: #ffffff;
        background: #0969da;
      }

      span[data-component="Pagination.Page"] {
        color: #656d76;
      }

      @media (max-width: 544px) {
        [data-component="Pagination.Page"] {
          display: none;
        }
      }

      /* 旧版 Rails 分页（PR 列表），样式复刻自 GitHub 的 .pagination 规则 */
      .pagination a,
      .pagination span {
        box-sizing: border-box;
        display: inline-block;
        min-width: 32px;
        padding: 5px 10px;
        border: 1px solid transparent;
        border-radius: 6px;
        color: #1f2328;
        font-size: 12px;
        font-weight: 500;
        line-height: 20px;
        text-align: center;
        cursor: pointer;
      }

      .pagination a:hover {
        border-color: #d0d7de;
      }

      .pagination .previous_page,
      .pagination .next_page {
        color: #0969da;
      }

      .pagination .current,
      .pagination .current:hover {
        border-color: transparent;
        color: #ffffff;
        background: #0969da;
      }

      .pagination .disabled {
        color: #8c959f;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <nav aria-label="Pagination" data-component="Pagination">
      <div data-hidden-viewport-ranges>
        <a data-component="Pagination.PreviousPage" rel="prev" href="#5">Previous</a>
        <a data-component="Pagination.Page" href="#1" aria-label="Page 1">1</a>
        <a data-component="Pagination.Page" href="#2" aria-label="Page 2">2</a>
        <a data-component="Pagination.Page" href="#3" aria-label="Page 3">3</a>
        <a data-component="Pagination.Page" href="#4" aria-label="Page 4">4</a>
        <a data-component="Pagination.Page" href="#5" aria-label="Page 5">5</a>
        <a data-component="Pagination.Page" href="#6" aria-label="Page 6" aria-current="page">6</a>
        <a data-component="Pagination.Page" href="#7" aria-label="Page 7">7</a>
        <a data-component="Pagination.Page" href="#8" aria-label="Page 8">8</a>
        <span data-component="Pagination.Page" role="presentation">…</span>
        <a data-component="Pagination.Page" href="#40" aria-label="Page 40" data-total-pages="40">40</a>
        <a data-component="Pagination.NextPage" rel="next" href="#7">Next</a>
      </div>
    </nav>
    <div class="paginate-container">
      <div role="navigation" aria-label="Pagination" class="pagination">
        <span class="previous_page disabled" role="link" aria-label="Previous page" aria-disabled="true">Previous</span>
        <a class="current" aria-label="Page 1" aria-current="page" data-total-pages="20" href="#1">1</a>
        <a aria-label="Page 2" href="#2">2</a>
        <a aria-label="Page 3" href="#3">3</a>
        <a aria-label="Page 4" href="#4">4</a>
        <span class="gap">&hellip;</span>
        <a aria-label="Page 20" href="#20">20</a>
        <a class="next_page" aria-label="Next page" rel="next" href="#2">Next</a>
      </div>
    </div>
    <script src="../src/core.js"></script>
    <script src="../src/content.js"></script>
  </body>
</html>
